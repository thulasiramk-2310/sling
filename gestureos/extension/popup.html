<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GestureOS</title>
  </head>
  <body class="popup">
    <header class="pop-head"><span class="mark">G</span><b>GestureOS</b><span class="state" id="state">Off</span></header>
    <button class="primary" id="toggle">Start GestureOS</button>
    <p class="note" id="note">Shortcut: <kbd>Alt</kbd> + <kbd>G</kbd> on any website.</p>
    <ul class="mini-list">
      <li><b>Open palm</b> wake · <b>Fist</b> pause</li>
      <li><b>Pinch</b> click · <b>Pinch + move</b> drag</li>
      <li><b>Two fingers</b> scroll · <b>Swipe</b> back</li>
    </ul>
    <button class="link" id="settings">Settings &amp; camera</button>
    <script type="module" src="../src/extension/popup.ts"></script>
  </body>
</html>
